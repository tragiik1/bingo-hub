[package]
name = "bingo-hub"
version = "1.0.8"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "bingo-hub"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.33.3", default-features = false, features = ["glow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_Controls_Dialogs", "Win32_Security", "Win32_UI_Controls", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
